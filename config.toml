# Daily Digest configuration

[feed]
title = "Ethan's Daily Digest"
author = "Daily Digest"
# Filled in after the GitHub repo exists:
site_url = "https://ejkemp.github.io/daily-digest"
feed_url = "https://ejkemp.github.io/daily-digest/feed.xml"

[hackernews]
min_score = 350
window_hours = 24
max_items = 30

[lesswrong]
min_karma = 50
window_hours = 24
max_items = 20

[blogs]
# Add the feed URLs of blogs you follow, e.g.
# feeds = ["https://www.example.com/rss.xml", "https://blog.example.org/atom.xml"]
feeds = ["https://leiterreports.com/feed/", "https://dailynous.com/feed/"]
window_hours = 48

[digest]
# Model passed to `claude -p --model ...`. sonnet keeps subscription usage light;
# switch to "opus" if you want higher-quality prose.
claude_model = "sonnet"
claude_timeout_seconds = 600
keep_entries = 30
