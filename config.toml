# Daily Digest configuration

[feed]
title = "Ethan's Daily Digest"
author = "Daily Digest"
# Filled in after the GitHub repo exists:
site_url = "https://ejkemp.github.io/daily-digest"
feed_url = "https://ejkemp.github.io/daily-digest/feed.xml"

[content]
# Per-link article scraping, so the digest summarizes real content rather than
# inventing it from the title. Applies to Hacker News links and LessWrong posts.
max_chars = 4000          # cap per-item text so the prompt stays a sane size
fetch_timeout_seconds = 15

[hackernews]
min_score = 350
window_hours = 24
max_items = 30

[lesswrong]
min_karma = 50
window_hours = 24
max_items = 20

[digest]
# Model passed to `claude -p --model ...`. sonnet keeps subscription usage light;
# switch to "opus" if you want higher-quality prose.
claude_model = "sonnet"
claude_timeout_seconds = 600
keep_entries = 30
